project:
  name: satellite_change_detection_temporal_transformer
  seed: 42
  deterministic: true

data:
  root: ./datasets/LEVIR-CD
  train_split: train
  val_split: val
  test_split: test
  patch_size: 256
  stride: 256
  batch_size: 2
  num_workers: 2
  pin_memory: true
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

model:
  type: proposed
  channels: [32, 64, 128, 256]
  heads: 8
  layers: 2
  dropout: 0.10
  use_temporal_self_attention: true
  use_cross_attention: true
  use_multiscale: true

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: null

training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 10
  save_every: 5

optimizer:
  name: adamw

scheduler:
  name: plateau
  factor: 0.5
  patience: 3
  min_lr: 0.00000001

evaluation:
  threshold: 0.5

output:
  root: ./experiments/proposed_model
